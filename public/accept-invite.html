<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Next — Accept Invitation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4efe6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border: 1px solid #e4dccd; border-radius: 10px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; }
    .crest { font-size: 44px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #2a221a; margin-bottom: 4px; font-weight: 700; }
    .subtitle { color: #8c7b5e; font-size: 13px; margin-bottom: 20px; }
    .invite-info { background: #faf7f0; border: 1px solid #e4dccd; border-radius: 6px; padding: 14px 18px; margin-bottom: 18px; font-size: 13px; text-align: left; color: #4a3728; }
    .invite-info strong { color: #2a221a; }
    label { display: block; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8c7b5e; margin-bottom: 6px; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #c8b89a; border-radius: 6px; font-size: 15px; font-family: inherit; background: #faf7f0; color: #2a221a; outline: none; }
    input:focus { border-color: #8c7b5e; }
    button { width: 100%; padding: 12px; background: #2a221a; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer; font-weight: 600; margin-top: 20px; }
    button:hover { background: #3d3324; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; text-align: left; }
    .msg.error { background: #fce8e8; color: #c0392b; border: 1px solid #f0c0c0; }
    .role-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-left: 4px; background: #e8eef8; color: #2a4a80; }
    .role-pill.admin { background: #fef3cd; color: #7a5c00; }
  </style>
</head>
<body>
  <div class="card">
    <div class="crest">💿</div>
    <h1>Welcome to Spin Next</h1>
    <p class="subtitle" id="subtitle">Verifying invitation…</p>
    <div class="msg" id="msg"></div>
    <div class="invite-info" id="info" style="display:none"></div>
    <form id="form" style="display:none">
      <label for="username">Pick a Username</label>
      <input type="text" id="username" autocomplete="username" required pattern="[A-Za-z0-9_]+" minlength="2">
      <label for="pw1">Password (min 8 chars)</label>
      <input type="password" id="pw1" autocomplete="new-password" required minlength="8">
      <label for="pw2">Confirm Password</label>
      <input type="password" id="pw2" autocomplete="new-password" required minlength="8">
      <button type="submit" id="btn">Create Account &amp; Sign In</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const subtitle = document.getElementById('subtitle');
    const info = document.getElementById('info');
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function showError(t) { msg.className = 'msg error'; msg.textContent = t; msg.style.display = 'block'; }

    (async () => {
      if (!token) { subtitle.textContent = ''; showError('Missing invitation token.'); return; }
      try {
        const r = await fetch('/api/invitations/verify/' + encodeURIComponent(token));
        const data = await r.json();
        if (!r.ok) { subtitle.textContent = ''; showError(data.error || 'Invitation could not be verified.'); return; }
        subtitle.textContent = `${esc(data.invited_by)} invited you to join.`;
        info.innerHTML = `
          <div><strong>Email:</strong> ${esc(data.email)}</div>
          <div style="margin-top:6px"><strong>Role:</strong>
            <span class="role-pill ${esc(data.role)}">${esc(data.role.charAt(0).toUpperCase() + data.role.slice(1))}</span>
          </div>`;
        info.style.display = 'block';
        form.style.display = 'block';
      } catch { subtitle.textContent = ''; showError('Network error.'); }
    })();

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1 !== pw2) { showError('Passwords do not match.'); return; }
      if (pw1.length < 8) { showError('Password must be at least 8 characters.'); return; }
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        const r = await fetch('/api/invitations/accept', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, username, password: pw1 }),
        });
        const data = await r.json();
        if (!r.ok) { showError(data.error || 'Failed.'); btn.disabled = false; btn.textContent = 'Create Account & Sign In'; return; }
        Object.keys(localStorage).filter(k => k.startsWith('sn_')).forEach(k => localStorage.removeItem(k));
        localStorage.setItem('sn_token', data.token);
        localStorage.setItem('sn_username', data.username);
        localStorage.setItem('sn_role', data.role);
        window.location.href = '/';
      } catch { showError('Network error.'); btn.disabled = false; btn.textContent = 'Create Account & Sign In'; }
    });
  </script>
</body>
</html>
