<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Next — Forgot Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4efe6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border: 1px solid #e4dccd; border-radius: 10px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; }
    .crest { font-size: 44px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #2a221a; margin-bottom: 4px; font-weight: 700; }
    .subtitle { color: #8c7b5e; font-size: 13px; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8c7b5e; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #c8b89a; border-radius: 6px; font-size: 15px; font-family: inherit; background: #faf7f0; color: #2a221a; outline: none; }
    input:focus { border-color: #8c7b5e; }
    button { width: 100%; padding: 12px; background: #2a221a; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer; margin-top: 18px; font-weight: 600; }
    button:hover { background: #3d3324; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; text-align: left; }
    .msg.success { background: #e8f4e8; color: #2a6b2a; border: 1px solid #b8d8b8; }
    .msg.error   { background: #fce8e8; color: #c0392b; border: 1px solid #f0c0c0; }
    .footer-link { text-align: center; margin-top: 18px; font-size: 13px; }
    .footer-link a { color: #8c7b5e; text-decoration: none; border-bottom: 1px dotted #c8b89a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="crest">💿</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your account email.</p>
    <div class="msg" id="msg"></div>
    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <button type="submit" id="btn">Send Reset Link</button>
    </form>
    <p class="footer-link"><a href="/login.html">← Back to sign in</a></p>
  </div>
  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      msg.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const r = await fetch('/api/password-reset/request', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await r.json();
        msg.className = r.ok ? 'msg success' : 'msg error';
        msg.textContent = r.ok ? (data.message || 'Check your email.') : (data.error || 'Something went wrong.');
        msg.style.display = 'block';
        if (r.ok) form.querySelector('input').value = '';
      } catch { msg.className = 'msg error'; msg.textContent = 'Network error.'; msg.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
