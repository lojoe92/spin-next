<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Next — Set New Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4efe6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border: 1px solid #e4dccd; border-radius: 10px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; }
    .crest { font-size: 44px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #2a221a; margin-bottom: 4px; font-weight: 700; }
    .subtitle { color: #8c7b5e; font-size: 13px; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8c7b5e; margin-bottom: 6px; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #c8b89a; border-radius: 6px; font-size: 15px; font-family: inherit; background: #faf7f0; color: #2a221a; outline: none; }
    input:focus { border-color: #8c7b5e; }
    button { width: 100%; padding: 12px; background: #2a221a; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer; margin-top: 18px; font-weight: 600; }
    button:hover { background: #3d3324; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; text-align: left; }
    .msg.success { background: #e8f4e8; color: #2a6b2a; border: 1px solid #b8d8b8; }
    .msg.error   { background: #fce8e8; color: #c0392b; border: 1px solid #f0c0c0; }
    .footer-link { text-align: center; margin-top: 18px; font-size: 13px; }
    .footer-link a { color: #8c7b5e; text-decoration: none; border-bottom: 1px dotted #c8b89a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="crest">💿</div>
    <h1>Set New Password</h1>
    <p class="subtitle" id="subtitle">Verifying link…</p>
    <div class="msg" id="msg"></div>
    <form id="form" style="display:none">
      <label for="pw1">New Password</label>
      <input type="password" id="pw1" autocomplete="new-password" required minlength="8">
      <label for="pw2">Confirm Password</label>
      <input type="password" id="pw2" autocomplete="new-password" required minlength="8">
      <button type="submit" id="btn">Set Password</button>
    </form>
    <p class="footer-link"><a href="/login.html">← Back to sign in</a></p>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const subtitle = document.getElementById('subtitle');
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    function showError(t) { msg.className = 'msg error'; msg.textContent = t; msg.style.display = 'block'; }

    (async () => {
      if (!token) { subtitle.textContent = ''; showError('Missing token.'); return; }
      try {
        const r = await fetch('/api/password-reset/verify/' + encodeURIComponent(token));
        const data = await r.json();
        if (!r.ok) { subtitle.textContent = ''; showError(data.error || 'Invalid or expired link.'); return; }
        subtitle.textContent = `Hello ${data.username || 'there'} — pick a new password.`;
        form.style.display = 'block';
      } catch { subtitle.textContent = ''; showError('Network error.'); }
    })();

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.style.display = 'none';
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1 !== pw2) { showError('Passwords do not match.'); return; }
      if (pw1.length < 8) { showError('Password must be at least 8 characters.'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const r = await fetch('/api/password-reset/confirm', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw1 }),
        });
        const data = await r.json();
        if (!r.ok) { showError(data.error || 'Failed.'); btn.disabled = false; btn.textContent = 'Set Password'; return; }
        msg.className = 'msg success'; msg.textContent = 'Password updated. Redirecting…'; msg.style.display = 'block';
        form.style.display = 'none';
        setTimeout(() => window.location.href = '/login.html', 1500);
      } catch { showError('Network error.'); btn.disabled = false; btn.textContent = 'Set Password'; }
    });
  </script>
</body>
</html>
