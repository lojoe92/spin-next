name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - 'docs/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    # Pinned so the runner image (which ships with the Android SDK) doesn't change under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bundle the web app into the Android project
        run: python3 tools/build.py data && python3 tools/build.py android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK; just make sure its licences are accepted, non-interactively.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spin-next-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
